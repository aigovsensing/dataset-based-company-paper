<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데이터셋 기반 Major Company 논문 조회</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="langsw" role="group" aria-label="Language"><button type="button" data-lang="ko">한국어</button><button type="button" data-lang="en">English</button></div><h1 data-i18n="h1"></h1>
<p class="sub" data-i18n="subtitle"></p></header>
<main>
  <section class="card">
    <h2 data-i18n="searchCond"></h2>
    <div class="grid">
      <label><span class="req" data-i18n="req"></span> <span data-i18n="fromYear"></span> <input id="fromYear" class="required" type="number" min="2000" step="1" required><small data-i18n="fromYearHint"></small></label>
      <label><span class="req" data-i18n="req"></span> <span data-i18n="dsName"></span> <input id="dsName" class="required" required></label>
      <label><span class="req" data-i18n="req"></span> <span data-i18n="dsUrl"></span> <input id="dsUrl" class="required" required></label>
    </div>
    <details class="opt"><summary data-i18n="advanced"></summary><div class="grid">
      <label><span data-i18n="keywords"></span> <input id="dsKeywords" data-i18n-ph="kwPh"></label>
      <label><span data-i18n="refId"></span> <input id="dsRef" data-i18n-ph="refPh"><small data-i18n="refHint"></small></label>
    </div></details>
    <h3><span data-i18n="majorCompany"></span> <span id="compCount"></span></h3>
    <div class="row"><button id="selAll" class="ghost" data-i18n="selAll"></button><button id="selNone" class="ghost" data-i18n="selNone"></button></div>
    <div id="companies" class="chips"></div>
    <form id="compForm" class="row">
      <input id="cName" data-i18n-ph="cNamePh" required>
      <input id="cAliases" data-i18n-ph="cAliasPh" size="40">
      <button type="submit" id="cSave" data-i18n="add"></button><button type="button" id="cCancel" class="ghost" data-i18n="cancel" hidden></button>
    </form>
    <small data-i18n-html="compNote"></small>
    <div class="row"><button id="go" class="primary" data-i18n="go"></button><span id="status"></span></div>
    <div id="bar" hidden><div></div></div><pre id="log" hidden></pre>
  </section>

  <section class="card" id="resultCard" hidden>
    <div class="row between"><h2><span data-i18n="results"></span> <span id="resCount"></span></h2>
      <div class="row"><label class="inline"><input type="checkbox" id="onlyOfficial"> <span data-i18n="onlyOfficial"></span></label>
      <button id="csv" class="ghost" data-i18n="csv"></button></div></div>
    <p id="meta" class="sub"></p>
    <div class="row between toolbar"><div class="row"><input id="q" type="search" data-i18n-ph="searchPh" size="36"><button id="qClear" class="ghost" data-i18n="clear"></button></div>
      <label class="inline"><span data-i18n="perPageA"></span>&nbsp;<select id="pageSize"><option>10</option><option selected>20</option><option>30</option><option>50</option><option>70</option><option>100</option><option>200</option></select>&nbsp;<span data-i18n="perPageB"></span></label></div>
    <div class="scroll"><table><thead><tr>
      <th data-i18n="thNo"></th><th data-i18n="thVenue"></th><th data-i18n="thPaper"></th><th data-i18n="thCompany"></th><th data-i18n="thLink"></th><th data-i18n="thDataset"></th><th data-i18n="thUsage"></th><th></th>
    </tr></thead><tbody id="rows"></tbody></table></div>
    <nav id="pager" class="pager"></nav>
  </section>

  <section class="card notice">
    <h2 data-i18n="noticeTitle"></h2>
    <ul>
      <li data-i18n-html="notice1"></li>
      <li data-i18n-html="notice2"></li>
      <li data-i18n="notice3"></li>
    </ul>
  </section>
</main>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
